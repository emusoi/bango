<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bango</title>
<style>
:root {
  --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66; --line: #e4e4e0;
  --sel: #ececeb; --waiting: #b4552d; --done: #3f7d4e; --dirty: #a5852b;
  --blocked: #a33; --detached: #8a6d1f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --fg: #e8e8e4; --muted: #8a8a84; --line: #2a2a30;
          --sel: #23232a; --waiting: #e0875a; --done: #7fbf8f; --dirty: #d6b75f;
          --blocked: #e08080; --detached: #cbb26a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); margin: 2px 0 20px; }
/* A label is the producer's words — a path, a ref, a name — so it is drawn
   as it was written. Lowercasing one quietly changed what it said. */
.section { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
td.section { padding: 18px 0 6px; max-width: none; }
td.verbatim { max-width: none; width: auto; white-space: pre; overflow: visible;
  text-overflow: clip; }
tr:has(> td.section) { border-bottom: none; }
table { width: 100%; border-collapse: collapse; }
tr { border-bottom: 1px solid var(--line); cursor: default; }
tr.sel { background: var(--sel); }
td { padding: 5px 14px 5px 0; vertical-align: top; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 48ch; width: 1%; }
td.grow { width: auto; }
td.mark { width: 2ch; padding-right: 10px; }
td.note { color: var(--muted); text-align: right; white-space: nowrap; }
td.count { text-align: right; font-variant-numeric: tabular-nums; }
td.time { color: var(--muted); font-variant-numeric: tabular-nums; }
tr.dim td { color: var(--muted); }
.mark[data-mark="waiting"] { color: var(--waiting); }
.mark[data-mark="done"] { color: var(--done); }
.mark[data-mark="dirty"] { color: var(--dirty); }
.mark[data-mark="blocked"] { color: var(--blocked); }
.mark[data-mark="detached"] { color: var(--detached); }
/* A tone says what a span is; the page decides what colour that is. */
.t-changed { color: var(--dirty); font-weight: 600; }
.t-comment { color: var(--muted); font-style: italic; }
.t-string  { color: var(--done); }
.t-number  { color: var(--detached); }
.t-keyword { color: var(--waiting); }
.t-name    { color: var(--fg); }
.t-type    { color: var(--blocked); }
.detail { padding: 6px 0 12px 2ch; color: var(--muted); white-space: pre-wrap; }
.detail pre { margin: 6px 0 0; white-space: pre-wrap; font: inherit; }
.acts { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
button:hover { background: var(--sel); }
button[disabled] { opacity: .4; cursor: not-allowed; }
.empty { color: var(--muted); padding: 24px 0; }
.hints { margin-top: 28px; color: var(--muted); font-size: 12px; }
.globals { display: flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 0; }
.help { margin-top: 18px; color: var(--muted); font-size: 12px; }
.help div { padding: 2px 0; }
.help b { color: var(--fg); font-weight: 600; display: inline-block; min-width: 3ch; }
.back { color: var(--muted); font-size: 12px; margin-bottom: 10px; cursor: pointer;
  background: none; border: none; padding: 0; font-family: inherit; }
.back:hover { color: var(--fg); background: none; }
.alert { margin-top: 14px; color: var(--blocked); white-space: pre-wrap; }
.off { position: fixed; top: 10px; right: 12px; color: var(--muted); font-size: 12px; }
dialog { border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  color: var(--fg); padding: 0; width: min(680px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog .inner { padding: 16px; }
dialog p { margin: 0 0 10px; font: inherit; }
dialog .where { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
dialog textarea { width: 100%; min-height: 108px; resize: vertical; font: inherit;
  color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 4px; padding: 8px; }
dialog textarea:focus { outline: none; border-color: var(--muted); }
dialog .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
dialog .row .spacer { flex: 1; }
dialog .row small { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<main>
  <button class="back" id="back" hidden>← back  esc</button>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div id="body"></div>
  <div class="globals" id="globals"></div>
  <div class="help" id="help" hidden></div>
  <div class="hints" id="hints"></div>
  <div class="alert" id="alert"></div>
</main>
<div class="off" id="off" hidden>disconnected</div>
<dialog id="ask">
  <div class="inner">
    <p id="ask-what"></p>
    <div class="where" id="ask-where"></div>
    <textarea id="ask-text" spellcheck="true"></textarea>
    <div class="row">
      <small id="ask-how"></small>
      <span class="spacer"></span>
      <button type="button" id="ask-no">cancel</button>
      <button type="button" id="ask-yes">save</button>
    </div>
  </div>
</dialog>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const glyphs = { here: "▸", new: "○", working: "◐", waiting: "⏎",
  done: "✓", dirty: "●", blocked: "⨯", detached: "⚠" };
let panel = null, cursor = null, readOnly = false, depth = 0, helping = false;

const $ = (id) => document.getElementById(id);

// A panel writes its keys the way they are drawn. A keyboard names them.
const named = { Enter: "⏎", " ": "space", Escape: "esc" };
const keyOf = (event) => named[event.key] || event.key;
$("back").onclick = () => back();

function rowsOf(p) {
  const out = [];
  const walk = (r, depth, verbatim) => {
    out.push([r, depth, verbatim]);
    (r.children || []).forEach(c => walk(c, depth + 1, verbatim));
  };
  (p.sections || []).forEach(s => {
    if (!s.collapsed) (s.rows || []).forEach(r => walk(r, 0, s.layout === "lines"));
  });
  return out;
}

function columns(p) {
  const names = [];
  rowsOf(p).forEach(([r, , verbatim]) => {
    if (verbatim) return;
    (r.fields || []).forEach(f => {
      if (!names.some(n => n.name === f.name)) names.push({ name: f.name, kind: f.kind || "text" });
    });
  });
  return names;
}

// A page has no window on the panel — it draws every row — so keeping the
// cursor in sight is its own job. Only a move asks for it: a refresh arriving
// while someone is reading must not pull the page out from under them.
function draw(follow) {
  if (!panel) return;
  $("back").hidden = depth === 0;
  $("title").textContent = panel.title || "";
  $("subtitle").textContent = panel.subtitle || "";
  const body = $("body");
  body.replaceChildren();

  const rows = rowsOf(panel);
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = panel.empty || "nothing here";
    body.append(empty);
  }
  if (!rows.some(([r]) => r.id === cursor)) cursor = rows.length ? rows[0][0].id : null;

  const cols = columns(panel);
  const table = document.createElement("table");
  for (const section of panel.sections || []) {
    if (section.label) table.append(heading(section.label));
    if (section.collapsed) continue;
    const verbatim = section.layout === "lines";
    const walk = (row, depth) => {
      table.append(line(row, depth, cols, verbatim));
      if (row.id === cursor) {
        const detail = details(row);
        if (detail) table.append(detail);
      }
      (row.children || []).forEach(child => walk(child, depth + 1));
    };
    (section.rows || []).forEach(r => walk(r, 0));
  }
  if (table.childElementCount) body.append(table);
  $("hints").textContent = (panel.hints || []).join("  ·  ");

  const globals = $("globals");
  globals.replaceChildren();
  for (const [name, action] of globalActions()) {
    globals.append(button(name, action, undefined));
  }
  drawHelp();

  if (follow) {
    const at = body.querySelector("tr.sel");
    if (at) {
      at.scrollIntoView({ block: "nearest" });
      // What the row offers is drawn under it, so it is part of being in sight.
      const under = at.nextElementSibling;
      if (under && under.querySelector(".detail")) {
        under.scrollIntoView({ block: "nearest" });
      }
    }
  }
}

// `?` is a reserved key everywhere, and the page had no answer for it. Every
// action, its key and what it is for, whether or not a row offering it is under
// the cursor.
function drawHelp() {
  const help = $("help");
  help.hidden = !helping;
  help.replaceChildren();
  if (!helping) return;
  for (const [name, action] of Object.entries((panel && panel.actions) || {})) {
    const line = document.createElement("div");
    const key = document.createElement("b");
    key.textContent = action.key || " ";
    line.append(key, (action.label || name) + (action.help ? " — " + action.help : ""));
    help.append(line);
  }
}

// A global action is the screen's, not a row's. Nothing drew them, so a panel
// that offered them offered them to nobody.
function globalActions() {
  return Object.entries((panel && panel.actions) || {}).filter(([, a]) => a.global);
}

function button(name, action, row) {
  const element = document.createElement("button");
  element.textContent = (action.label || name) + (action.key ? "  " + action.key : "");
  element.disabled = readOnly;
  element.onclick = (event) => { event.stopPropagation(); run(name, action, row); };
  return element;
}

function heading(label) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = 99;
  td.className = "section";
  td.textContent = label;
  tr.append(td);
  return tr;
}

function line(row, depth, cols, verbatim) {
  const tr = document.createElement("tr");
  if (row.id === cursor) tr.classList.add("sel");
  if (row.dim) tr.classList.add("dim");
  tr.onclick = () => { cursor = row.id; draw(false); };

  const mark = document.createElement("td");
  mark.className = "mark";
  mark.dataset.mark = row.mark || "";
  mark.textContent = glyphs[row.mark] || "";
  tr.append(mark);

  if (verbatim) {
    const td = document.createElement("td");
    td.className = "verbatim";
    // through the elastic spacer as well, so what a long value overflows into
    // is the column that is there to absorb it, not the ones rows share.
    td.colSpan = Math.max(cols.length, 1) + 1;
    td.append(...tinted((row.fields || [])[0]));
    tr.append(td);
    tr.append(noteCell(row));
    return tr;
  }

  const byName = Object.fromEntries((row.fields || []).map(f => [f.name, f]));
  cols.forEach((col, i) => {
    const td = document.createElement("td");
    const field = byName[col.name];
    td.className = col.kind;
    td.textContent = (i === 0 ? "  ".repeat(depth) : "") + (field ? field.value : "");
    if (col.kind === "path" && field) td.title = field.value;
    tr.append(td);
  });

  const spacer = document.createElement("td");
  spacer.className = "grow";
  tr.append(spacer);

  tr.append(noteCell(row));
  return tr;
}

// A value with nothing said about it is one text node. A value with spans is
// that value cut at the edges the producer gave, each piece wearing its tone.
// Nothing here looks at what the text says.
function tinted(field) {
  const value = field?.value ?? "";
  const spans = field?.spans || [];
  if (!spans.length) return [document.createTextNode(value)];
  const runes = [...value];
  const out = [];
  let at = 0;
  for (const span of spans) {
    if (span.from >= runes.length) break;
    const to = Math.min(span.to, runes.length);
    if (span.from > at) out.push(document.createTextNode(runes.slice(at, span.from).join("")));
    const piece = document.createElement("span");
    if (span.tone) piece.className = "t-" + span.tone;
    piece.textContent = runes.slice(span.from, to).join("");
    out.push(piece);
    at = to;
  }
  if (at < runes.length) out.push(document.createTextNode(runes.slice(at).join("")));
  return out;
}

function noteCell(row) {
  const note = document.createElement("td");
  note.className = "note";
  note.textContent = row.note || "";
  return note;
}

function details(row) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = 99;
  td.className = "detail";
  (row.facts || []).forEach(fact => {
    const div = document.createElement("div");
    div.textContent = fact;
    td.append(div);
  });
  if ((row.preview || []).length) {
    const pre = document.createElement("pre");
    pre.textContent = row.preview.join("\n");
    td.append(pre);
  }
  const acts = document.createElement("div");
  acts.className = "acts";
  for (const name of row.actions || []) {
    const action = (panel.actions || {})[name];
    if (!action) continue;
    acts.append(button(name, action, row));
  }
  if (acts.childElementCount) td.append(acts);
  tr.append(td);
  return tr;
}

async function run(name, action, row) {
  let input = "";
  if (action.input) {
    input = await ask(action.input, row, true);
    if (!input) return;
  }
  if (action.confirm && !(await ask(action.confirm, row, false))) return;
  $("alert").textContent = "";
  const response = await fetch("/act?t=" + encodeURIComponent(token), {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Bango-Token": token },
    body: JSON.stringify({ action: name, row: row ? row.id : (cursor || ""), input }),
  });
  if (!response.ok) {
    const body = await response.text();
    $("alert").textContent = unwrap(body);
    return;
  }
  adopt(await response.json());
}

// A panel arrives with the depth it sits at, so the page never counts its own
// way back — the server is the one that knows.
// Answering a question about a line is not a reason to lose the line. A panel
// that comes back at the depth it was at is the same screen, so the cursor
// stays on it; a panel opened or left behind is a different one, and starts at
// its own top.
function adopt(payload) {
  const moved = (payload.depth || 0) !== depth;
  panel = payload.panel;
  depth = payload.depth || 0;
  if (moved) cursor = null;
  $("alert").textContent = payload.trouble || "";
  draw(!moved);
  if (moved) window.scrollTo(0, 0);
}

async function back() {
  if (!depth) return;
  const response = await fetch("/back?t=" + encodeURIComponent(token), {
    method: "POST", headers: { "X-Bango-Token": token },
  });
  if (!response.ok) return;
  adopt(await response.json());
}

// The server reports a refused action as {"error": "<what the producer said>"}.
// That is bango's own envelope, so it comes off here; whatever is inside is the
// producer's, and is shown exactly as it was written.
function unwrap(body) {
  try {
    const parsed = JSON.parse(body);
    if (parsed && typeof parsed.error === "string") return parsed.error.trim();
  } catch (e) { /* not ours; show it whole */ }
  return body.trim();
}

// A native prompt is one line, unstyled, and stops the page dead while it is up.
// Writing a finding is the main thing anybody does here, so it gets somewhere to
// write: a box on the page, as many lines as the finding needs.
function ask(what, row, writing) {
  const dialog = $("ask");
  const text = $("ask-text");
  $("ask-what").textContent = what;
  $("ask-where").textContent = row ? (row.fields || []).map(f => f.value).join("  ").trim() : "";
  $("ask-where").hidden = !row;
  text.hidden = !writing;
  text.value = "";
  $("ask-how").textContent = writing ? "⌘⏎ or ctrl⏎ to save · esc to cancel" : "esc to cancel";
  $("ask-yes").textContent = writing ? "save" : "yes";
  return new Promise((settle) => {
    // Settled by what closes it, not by the close event: the answer is known at
    // the moment a button is pressed, and nothing has to be read back off the
    // element afterwards.
    const finish = (yes) => {
      dialog.onkeydown = null;
      dialog.close();
      settle(yes ? (writing ? text.value.trim() : true) : (writing ? "" : false));
    };
    $("ask-yes").onclick = () => finish(true);
    $("ask-no").onclick = () => finish(false);
    dialog.onkeydown = (event) => {
      if (event.key === "Escape") { event.preventDefault(); finish(false); }
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey || !writing)) {
        event.preventDefault();
        finish(true);
      }
    };
    dialog.showModal();
    if (writing) text.focus();
  });
}

function listen() {
  const source = new EventSource("/events?t=" + encodeURIComponent(token));
  source.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    panel = payload.panel;
    depth = payload.depth || 0;
    $("alert").textContent = payload.trouble || "";
    $("off").hidden = true;
    draw(false);
  };
  source.onerror = () => { $("off").hidden = false; };
}

document.addEventListener("keydown", (event) => {
  if (!panel || $("ask").open) return;
  if (event.key === "?") { event.preventDefault(); helping = !helping; drawHelp(); return; }
  if (event.key === "Escape" || event.key === "q") { event.preventDefault(); back(); return; }
  for (const [name, action] of globalActions()) {
    if (action.key === keyOf(event)) {
      event.preventDefault();
      run(name, action, undefined);
      return;
    }
  }
  const rows = rowsOf(panel);
  if (!rows.length) return;
  let at = rows.findIndex(([r]) => r.id === cursor);
  const here = at >= 0 ? rows[at][0] : undefined;
  for (const name of (here && here.actions) || []) {
    const action = (panel.actions || {})[name];
    if (action && action.key === keyOf(event)) {
      event.preventDefault();
      run(name, action, here);
      return;
    }
  }
  if (event.key === "j" || event.key === "ArrowDown") at = Math.min(at + 1, rows.length - 1);
  else if (event.key === "k" || event.key === "ArrowUp") at = Math.max(at - 1, 0);
  else return;
  event.preventDefault();
  cursor = rows[at][0].id;
  draw(true);
});

fetch("/panel?t=" + encodeURIComponent(token), { headers: { "X-Bango-Token": token } })
  .then(r => r.json())
  .then(payload => {
    readOnly = payload.readOnly;
    adopt(payload);
    listen();
  })
  .catch(() => { $("title").textContent = "bango: could not reach the server"; });
</script>
</body>
</html>
